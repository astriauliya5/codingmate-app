<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil</title>
  <link rel="stylesheet" href="akun.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Profil</h1>

      <button class="btn" onclick="window.history.back()">Back</button>

      <form class="mentor-form">
        <section class="form-card">
          <h3>Informasi Pengguna</h3>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" />
          </div>

          <div class="form-group">
            <label for="nama-lengkap">Nama Lengkap</label>
            <input type="text" id="nama-lengkap" name="nama-lengkap" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="no-telp">No. Telp</label>
            <input type="text" id="no-telp" name="no-telp" />
          </div>

          <div class="form-group">
            <label for="alamat">Alamat</label>
            <input type="text" id="alamat" name="alamat" />
          </div>

          <button type="button" class="btn-save" onclick="saveAkunInfo()">
            Simpan
          </button>
        </section>

        <section class="form-card">
          <h3>Ubah Password</h3>

          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="new-password" placeholder="Value" />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Value" />
          </div>

          <button type="button" class="btn-save" onclick="savePassword()">
            Simpan
          </button>
        </section>
      </form>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      await loadAkunInfo();
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    async function loadAkunInfo() {
      try {
        const response = await fetch('/api/auth/me', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET ME ERROR:', result);
          alert(result.message || 'Gagal mengambil informasi akun.');
          return;
        }

        const user = result.user || result;

        document.getElementById('username').value = user.username || '';
        document.getElementById('nama-lengkap').value = user.full_name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('no-telp').value = user.phone || '';
        document.getElementById('alamat').value = user.address || '';
      } catch (error) {
        console.error('LOAD AKUN INFO ERROR:', error);
        alert('Terjadi kesalahan saat mengambil informasi akun.');
      }
    }

    async function saveAkunInfo() {
      const payload = {
        username: document.getElementById('username').value.trim(),
        full_name: document.getElementById('nama-lengkap').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('no-telp').value.trim(),
        address: document.getElementById('alamat').value.trim()
      };

      if (!payload.username || !payload.full_name || !payload.email) {
        alert('Username, nama lengkap, dan email wajib diisi.');
        return;
      }

      try {
        const response = await fetch('/api/auth/me', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menyimpan informasi akun.');
          return;
        }

        if (result.user) {
          localStorage.setItem('currentUser', JSON.stringify(result.user));
        }

        alert(result.message || 'Informasi akun berhasil diperbarui.');
      } catch (error) {
        console.error('SAVE AKUN INFO ERROR:', error);
        alert('Terjadi kesalahan saat menyimpan informasi akun.');
      }
    }

    async function savePassword() {
      const oldPassword = document.getElementById('old-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!oldPassword || !newPassword || !confirmPassword) {
        alert('Semua kolom password harus diisi.');
        return;
      }

      if (newPassword !== confirmPassword) {
        alert('Password baru dan konfirmasi password tidak sama.');
        return;
      }

      try {
        const response = await fetch('/api/auth/me/password', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify({
            old_password: oldPassword,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal memperbarui password.');
          return;
        }

        document.getElementById('old-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';

        alert(result.message || 'Password berhasil diperbarui.');
      } catch (error) {
        console.error('SAVE PASSWORD ERROR:', error);
        alert('Terjadi kesalahan saat memperbarui password.');
      }
    }
  </script>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="/assets/js/sidebar.js"></script>
</body>
</html>
