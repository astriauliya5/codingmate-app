<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tukar Jadwal</title>
  <link rel="stylesheet" href="jadwal-admin.css" />
  <link rel="stylesheet" href="../../assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Tukar Jadwal</h1>

      <button class="btn" onclick="window.location.href='pengaturan-jadwal.html'">
        Back
      </button>

      <form id="swapScheduleForm" action="#" class="form-outer">
        <div class="form-group">
          <label for="mentor-name">Nama Mentor</label>
          <input type="text" id="mentor-name" name="mentor-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="student-name">Nama Siswa</label>
          <input type="text" id="student-name" name="student-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="level-name">Nama Level</label>
          <input type="text" id="level-name" name="level-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="class-type-name">Jenis Kelas</label>
          <input type="text" id="class-type-name" name="class-type-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="sisa-kredit">Sisa Kredit</label>
          <input type="text" id="sisa-kredit" name="sisa-kredit" value="Auto" disabled />
        </div>

<!-- Jadwal Lama -->
<div class="form-group jadwal-lama-tukar">
  <h4>Jadwal Lama</h4>

  <div class="days">
    <div class="day-block-lama" id="old-day">
      <label for="original-date">Tanggal</label>
      <input type="date" id="original-date" />

      <label for="old-time">Jam</label>
      <div class="time-row">
        <input type="text" id="old-time" value="Auto" readonly />
        <span>WIB</span>
      </div>
    </div>
  </div>
</div>

<!-- Jadwal Baru -->
<div class="form-group jadwal-baru-tukar">
  <h4>Jadwal Baru</h4>

  <div class="days">
    <div class="day-block" id="new-day">
      <label for="new-date">Tanggal</label>
      <input type="date" id="new-date" />

      <label for="new-start-time">Jam</label>
      <div class="time-row">
        <input type="time" id="new-start-time" class="start-time" />
        <span>WIB</span>
      </div>

      <input type="hidden" id="new-end-time" />
    </div>
  </div>
</div>

        <div class="validation">
          <button type="button" class="btn-option" onclick="window.location.href='pengaturan-jadwal.html'">
            Cancel
          </button>

          <button type="submit" class="btn-option">
            Simpan
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    let scheduleContext = null;
    let currentSchedules = [];
    let selectedSchedule = null;

    document.addEventListener('DOMContentLoaded', async function () {
      const form = document.getElementById('swapScheduleForm');
      const originalDateInput = document.getElementById('original-date');
      const newDateInput = document.getElementById('new-date');
      const newStartTimeInput = document.getElementById('new-start-time');

      scheduleContext = JSON.parse(localStorage.getItem('scheduleContext'));

      if (!scheduleContext) {
        alert('Data pengaturan jadwal belum dipilih.');
        window.location.href = 'pengaturan-jadwal.html';
        return;
      }

      await loadScheduleContextDetail();
      await loadRoutineSchedules();

      originalDateInput.addEventListener('change', handleOriginalDateChange);

      newDateInput.addEventListener('change', function () {
        const newDateDay = getDayOfWeekMondayBased(this.value);

        if (newDateDay === 6) {
          alert('Tanggal baru tidak boleh hari Minggu.');
          this.value = '';
        }
      });

      newStartTimeInput.addEventListener('change', function () {
        document.getElementById('new-end-time').value = addOneHour(this.value);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        await submitSwapSchedule();
      });
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    function formatClassType(value) {
      return value === 'trial' ? 'Trial' : 'Reguler';
    }

    function getDayName(day) {
      const dayNames = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return dayNames[Number(day)] || '-';
    }

    function normalizeTime(timeValue) {
      if (!timeValue) return '';
      return timeValue.length === 5 ? `${timeValue}:00` : timeValue;
    }

    function timeForInput(timeValue) {
      if (!timeValue) return '';
      return String(timeValue).slice(0, 5);
    }

    function addOneHour(timeValue) {
      if (!timeValue) return '';

      const [hour, minute] = timeValue.split(':').map(Number);

      const date = new Date();
      date.setHours(hour);
      date.setMinutes(minute);
      date.setSeconds(0);

      date.setHours(date.getHours() + 1);

      const endHour = String(date.getHours()).padStart(2, '0');
      const endMinute = String(date.getMinutes()).padStart(2, '0');

      return `${endHour}:${endMinute}`;
    }

    function getDayOfWeekMondayBased(dateString) {
      if (!dateString) return null;

      const [year, month, day] = dateString.split('-').map(Number);
      const date = new Date(year, month - 1, day);

      const jsDay = date.getDay();

      return jsDay === 0 ? 6 : jsDay - 1;
    }

    async function loadScheduleContextDetail() {
      try {
        const [studentResponse, mentorResponse, levelsResponse] = await Promise.all([
          fetch(`/api/students/${scheduleContext.student_id}`, {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          }),

          fetch(`/api/akun/${scheduleContext.mentor_id}`, {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          }),

          fetch('/api/levels', {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          })
        ]);

        const student = await studentResponse.json();
        const mentor = await mentorResponse.json();
        const levels = await levelsResponse.json();

        if (!studentResponse.ok) {
          alert(student.message || 'Data siswa tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        if (!mentorResponse.ok) {
          alert(mentor.message || 'Data mentor tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        if (!levelsResponse.ok) {
          alert(levels.message || 'Data level tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        const selectedLevelMaster = levels.find(level => {
          return Number(level.id) === Number(scheduleContext.level_id);
        });

        const selectedStudentLevel = (student.levels || []).find(level => {
          return Number(level.level_id) === Number(scheduleContext.level_id);
        });

        document.getElementById('mentor-name').value = mentor.full_name || mentor.username || '-';
        document.getElementById('student-name').value = student.full_name || '-';
        document.getElementById('level-name').value = selectedLevelMaster ? selectedLevelMaster.level_name : '-';
        document.getElementById('class-type-name').value = formatClassType(scheduleContext.class_type);

        if (selectedStudentLevel) {
          document.getElementById('sisa-kredit').value = `${selectedStudentLevel.remaining_credit} kredit`;
        } else {
          document.getElementById('sisa-kredit').value = 'Belum ada kredit';
        }
      } catch (error) {
        console.error('LOAD SCHEDULE CONTEXT ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data pengaturan jadwal.');
      }
    }

    async function loadRoutineSchedules() {
      try {
        const response = await fetch('/api/schedules', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

if (!response.ok) {
  console.error('SWAP ERROR RESULT:', result);
  alert(result.error || result.message || 'Gagal menukar jadwal.');
  return;
}

        currentSchedules = result.filter(schedule => {
          return Number(schedule.student_id) === Number(scheduleContext.student_id)
            && Number(schedule.level_id) === Number(scheduleContext.level_id)
            && Number(schedule.mentor_id) === Number(scheduleContext.mentor_id)
            && schedule.class_type === scheduleContext.class_type;
        });

        if (currentSchedules.length === 0) {
          alert('Belum ada jadwal rutin untuk siswa, level, mentor, dan jenis kelas ini.');
        }
      } catch (error) {
        console.error('LOAD ROUTINE SCHEDULES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data jadwal rutin.');
      }
    }

    function handleOriginalDateChange() {
      const originalDate = document.getElementById('original-date').value;
      const oldTimeInput = document.getElementById('old-time');

      oldTimeInput.value = 'Auto';
      selectedSchedule = null;

      if (!originalDate) return;

      const originalDateDay = getDayOfWeekMondayBased(originalDate);

      if (originalDateDay === 6) {
        alert('Tanggal lama tidak boleh hari Minggu.');
        document.getElementById('original-date').value = '';
        return;
      }

      const matchedSchedules = currentSchedules.filter(schedule => {
        return Number(schedule.day_of_week) === Number(originalDateDay);
      });

      if (matchedSchedules.length === 0) {
        alert(`Tidak ada jadwal rutin pada hari ${getDayName(originalDateDay)} untuk data yang dipilih.`);
        document.getElementById('original-date').value = '';
        return;
      }

      if (matchedSchedules.length > 1) {
        alert('Ada lebih dari satu jadwal rutin pada tanggal tersebut. Untuk sementara pilih data jadwal yang lebih spesifik dari pengaturan jadwal.');
        document.getElementById('original-date').value = '';
        return;
      }

      selectedSchedule = matchedSchedules[0];

      oldTimeInput.value = `${timeForInput(selectedSchedule.start_time)} - ${timeForInput(selectedSchedule.end_time)}`;
    }

    async function submitSwapSchedule() {
      const originalDate = document.getElementById('original-date').value;
      const newDate = document.getElementById('new-date').value;
      const newStartTime = normalizeTime(document.getElementById('new-start-time').value);
      const newEndTime = normalizeTime(document.getElementById('new-end-time').value);

      if (!selectedSchedule) {
        alert('Pilih tanggal jadwal lama yang sesuai dengan jadwal rutin terlebih dahulu.');
        return;
      }

      if (!originalDate || !newDate || !newStartTime || !newEndTime) {
        alert('Tanggal lama, tanggal baru, dan jam baru wajib diisi.');
        return;
      }

      const newDateDay = getDayOfWeekMondayBased(newDate);

      if (newDateDay === 6) {
        alert('Tanggal baru tidak boleh hari Minggu.');
        return;
      }

      if (newStartTime >= newEndTime) {
        alert('Jam mulai baru harus lebih kecil dari jam selesai baru.');
        return;
      }

      try {
        const response = await fetch('/api/schedules/swap', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify({
            routine_schedule_id: Number(selectedSchedule.id),
            original_date: originalDate,
            new_date: newDate,
            new_start_time: newStartTime,
            new_end_time: newEndTime
          })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menukar jadwal.');
          return;
        }

        alert('Tukar jadwal berhasil disimpan.');
        localStorage.removeItem('scheduleContext');
        window.location.href = '/admin/jadwal-siswa/jadwal-siswa.html';
      } catch (error) {
        console.error('SWAP SCHEDULE ERROR:', error);
        alert('Terjadi kesalahan saat menukar jadwal.');
      }
    }
  </script>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
</body>
</html>
