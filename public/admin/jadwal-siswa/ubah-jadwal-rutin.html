<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ubah Jadwal Rutin</title>
  <link rel="stylesheet" href="jadwal-admin.css" />
  <link rel="stylesheet" href="../../assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Ubah Jadwal Rutin</h1>

      <button class="btn" onclick="window.location.href='pengaturan-jadwal.html'">
        Back
      </button>

      <form id="updateRoutineScheduleForm" action="#" class="form-outer">
        <div class="form-group">
          <label for="mentor-name">Nama Mentor</label>
          <input type="text" id="mentor-name" name="mentor-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="student-name">Nama Siswa</label>
          <input type="text" id="student-name" name="student-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="level-name">Nama Level</label>
          <input type="text" id="level-name" name="level-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="class-type-name">Jenis Kelas</label>
          <input type="text" id="class-type-name" name="class-type-name" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="sisa-kredit">Sisa Kredit</label>
          <input type="text" id="sisa-kredit" name="sisa-kredit" value="Auto" disabled />
        </div>

        <div class="form-group">
          <label for="schedule-id">Jadwal Rutin Lama</label>
          <select id="schedule-id" name="schedule-id">
            <option value="">Pilih Jadwal</option>
          </select>
        </div>

        <div class="form-group">
          <label>Jadwal Baru:</label>

          <div class="days">
            <div class="day-block">
              <h4>Ubah Jadwal</h4>

              <label>Hari</label>
              <select id="day-select" class="day-select">
                <option value="">Value</option>
                <option value="0">Senin</option>
                <option value="1">Selasa</option>
                <option value="2">Rabu</option>
                <option value="3">Kamis</option>
                <option value="4">Jumat</option>
                <option value="5">Sabtu</option>
              </select>

              <label>Jam Mulai</label>
              <input type="time" id="start-time" class="start-time" />

              <label>Jam Selesai</label>
              <input type="time" id="end-time" class="end-time" readonly />
            </div>
          </div>
        </div>

        <div class="validation">
          <button type="button" class="btn-option" onclick="window.location.href='pengaturan-jadwal.html'">
            Cancel
          </button>

          <button type="submit" class="btn-option">
            Simpan
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    let scheduleContext = null;
    let currentSchedules = [];

    document.addEventListener('DOMContentLoaded', async function () {
      const form = document.getElementById('updateRoutineScheduleForm');
      const scheduleSelect = document.getElementById('schedule-id');
      const startTimeInput = document.getElementById('start-time');

      scheduleContext = JSON.parse(localStorage.getItem('scheduleContext'));

      if (!scheduleContext) {
        alert('Data pengaturan jadwal belum dipilih.');
        window.location.href = 'pengaturan-jadwal.html';
        return;
      }

      await loadScheduleContextDetail();
      await loadRoutineSchedules();

      scheduleSelect.addEventListener('change', fillSelectedSchedule);
      startTimeInput.addEventListener('change', function () {
        document.getElementById('end-time').value = addOneHour(this.value);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        await submitUpdateRoutineSchedule();
      });
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    function formatClassType(value) {
      if (value === 'trial') return 'Trial';
      return 'Reguler';
    }

    function getDayName(day) {
      const dayNames = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return dayNames[Number(day)] || '-';
    }

    function normalizeTime(timeValue) {
      if (!timeValue) return '';
      return timeValue.length === 5 ? `${timeValue}:00` : timeValue;
    }

    function timeForInput(timeValue) {
      if (!timeValue) return '';
      return String(timeValue).slice(0, 5);
    }

    function addOneHour(timeValue) {
      if (!timeValue) return '';

      const [hour, minute] = timeValue.split(':').map(Number);

      const date = new Date();
      date.setHours(hour);
      date.setMinutes(minute);
      date.setSeconds(0);

      date.setHours(date.getHours() + 1);

      const endHour = String(date.getHours()).padStart(2, '0');
      const endMinute = String(date.getMinutes()).padStart(2, '0');

      return `${endHour}:${endMinute}`;
    }

    async function loadScheduleContextDetail() {
      try {
        const [studentResponse, mentorResponse, levelsResponse] = await Promise.all([
          fetch(`/api/students/${scheduleContext.student_id}`, {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          }),

          fetch(`/api/akun/${scheduleContext.mentor_id}`, {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          }),

          fetch('/api/levels', {
            headers: {
              Authorization: `Bearer ${getToken()}`
            }
          })
        ]);

        const student = await studentResponse.json();
        const mentor = await mentorResponse.json();
        const levels = await levelsResponse.json();

        if (!studentResponse.ok) {
          alert(student.message || 'Data siswa tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        if (!mentorResponse.ok) {
          alert(mentor.message || 'Data mentor tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        if (!levelsResponse.ok) {
          alert(levels.message || 'Data level tidak ditemukan.');
          window.location.href = 'pengaturan-jadwal.html';
          return;
        }

        const selectedLevelMaster = levels.find(level => {
          return Number(level.id) === Number(scheduleContext.level_id);
        });

        const selectedStudentLevel = (student.levels || []).find(level => {
          return Number(level.level_id) === Number(scheduleContext.level_id);
        });

        document.getElementById('mentor-name').value = mentor.full_name || mentor.username || '-';
        document.getElementById('student-name').value = student.full_name || '-';
        document.getElementById('level-name').value = selectedLevelMaster ? selectedLevelMaster.level_name : '-';
        document.getElementById('class-type-name').value = formatClassType(scheduleContext.class_type);

        if (selectedStudentLevel) {
          document.getElementById('sisa-kredit').value = `${selectedStudentLevel.remaining_credit} kredit`;
        } else {
          document.getElementById('sisa-kredit').value = 'Belum ada kredit';
        }
      } catch (error) {
        console.error('LOAD SCHEDULE CONTEXT ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data pengaturan jadwal.');
      }
    }

    async function loadRoutineSchedules() {
      try {
        const response = await fetch('/api/schedules', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal mengambil data jadwal rutin.');
          return;
        }

        currentSchedules = result.filter(schedule => {
          return Number(schedule.student_id) === Number(scheduleContext.student_id)
            && Number(schedule.level_id) === Number(scheduleContext.level_id)
            && Number(schedule.mentor_id) === Number(scheduleContext.mentor_id)
            && schedule.class_type === scheduleContext.class_type;
        });

        const scheduleSelect = document.getElementById('schedule-id');
        scheduleSelect.innerHTML = `<option value="">Pilih Jadwal</option>`;

        currentSchedules.forEach(schedule => {
          const option = document.createElement('option');
          option.value = schedule.id;
          option.textContent = `${getDayName(schedule.day_of_week)} | ${timeForInput(schedule.start_time)} - ${timeForInput(schedule.end_time)}`;
          scheduleSelect.appendChild(option);
        });

        if (currentSchedules.length === 0) {
          alert('Belum ada jadwal rutin untuk siswa, level, mentor, dan jenis kelas ini.');
        }
      } catch (error) {
        console.error('LOAD ROUTINE SCHEDULES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data jadwal rutin.');
      }
    }

    function fillSelectedSchedule() {
      const scheduleId = document.getElementById('schedule-id').value;
      const selectedSchedule = currentSchedules.find(schedule => {
        return Number(schedule.id) === Number(scheduleId);
      });

      if (!selectedSchedule) {
        document.getElementById('day-select').value = '';
        document.getElementById('start-time').value = '';
        document.getElementById('end-time').value = '';
        return;
      }

      document.getElementById('day-select').value = selectedSchedule.day_of_week;
      document.getElementById('start-time').value = timeForInput(selectedSchedule.start_time);
      document.getElementById('end-time').value = timeForInput(selectedSchedule.end_time);
    }

    async function submitUpdateRoutineSchedule() {
      const scheduleId = document.getElementById('schedule-id').value;
      const dayOfWeek = document.getElementById('day-select').value;
      const startTime = normalizeTime(document.getElementById('start-time').value);
      const endTime = normalizeTime(document.getElementById('end-time').value);

      if (!scheduleId) {
        alert('Pilih jadwal rutin lama terlebih dahulu.');
        return;
      }

      if (!dayOfWeek || !startTime || !endTime) {
        alert('Hari, jam mulai, dan jam selesai wajib diisi.');
        return;
      }

      if (startTime >= endTime) {
        alert('Jam mulai harus lebih kecil dari jam selesai.');
        return;
      }

      try {
        const response = await fetch(`/api/schedules/routine/${scheduleId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify({
            day_of_week: Number(dayOfWeek),
            start_time: startTime,
            end_time: endTime
          })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal mengubah jadwal rutin.');
          return;
        }

        alert('Jadwal rutin berhasil diperbarui.');
        localStorage.removeItem('scheduleContext');
        window.location.href = '/admin/jadwal-siswa/jadwal-siswa.html';
      } catch (error) {
        console.error('UPDATE ROUTINE SCHEDULE ERROR:', error);
        alert('Terjadi kesalahan saat mengubah jadwal rutin.');
      }
    }
  </script>

  <script src="../../assets/js/sidebar.js"></script>
</body>
</html>
