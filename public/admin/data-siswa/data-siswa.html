<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Siswa</title>
  <link rel="stylesheet" href="data-siswa.css" />
  <link rel="stylesheet" href="../../assets/css/index.css" />
</head>
<body>
  <div class="container">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <div class="top-bar">
            <h1>Data Siswa</h1>
    <button class="btn" onclick="window.location.href='pendaftaran-siswa.html'">+ Pendaftaran Siswa Baru</button>

    <div class="table-container">
        <div class="table-header">
        <input type="text" id="search" placeholder="Search">
        <select id="tampil" onchange="updateRows()">
            <option value="20">Tampilkan 20 data</option>
            <option value="40">Tampilkan 40 data</option>
            <option value="60">Tampilkan 60 data</option>
        </select>
        </div>
        </div>
        
        <table id="table-container">
          <thead>
            <tr>
              <th>No</th>
              <th>Aksi</th>
              <th>Full Name</th>
              <th>Nickname</th>
              <th>Parent Name</th>
              <th>Borna Date</th>
              <th>Age</th>
              <th>Tanggal Bergabung</th>
              <th>Lama Bergabung</th>
              <th>Kelas Awal</th>
              <th>Kelas Sekarang</th>
              <th>No Telp</th>
              <th>Kota</th>
              <th>Sekolah</th>
              <th>Alamat</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="data-table-body">
            <!-- Data akan di-generate menggunakan JavaScript -->
          </tbody>
        </table>
    </div>
    </main>
  </div>
<script src="/assets/js/auth-guard.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    let allDataSiswa = [];
    let currentData = [];

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function generateTableRows(data) {
      const tableBody = document.querySelector("#data-table-body");
      const jumlahTampil = Number(document.getElementById('tampil').value);

      tableBody.innerHTML = '';

      data.slice(0, jumlahTampil).forEach((student, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>

          <td>
            <button class="hapus" onclick="hapusSiswa(${student.id})">
              X Hapus
            </button>
          </td>

          <td>
            <button class="btn-name" onclick="showDetailSiswa(${student.id})">
              ${student.full_name || '-'}
            </button>
          </td>

          <td>${student.nickname || '-'}</td>
          <td>${student.parent_name || '-'}</td>
          <td>${formatDate(student.born_date)}</td>
          <td>${student.age || '-'}</td>
          <td>${formatDate(student.joined_date)}</td>
          <td>${student.duration || '-'}</td>
          <td>${student.initial_class || '-'}</td>
          <td>${student.current_class || '-'}</td>
          <td>${student.phone || '-'}</td>
          <td>${student.city || '-'}</td>
          <td>${student.school || '-'}</td>
          <td>${student.address || '-'}</td>
          <td>${student.email || '-'}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    fetch('/api/students', {
      headers: {
        Authorization: `Bearer ${localStorage.getItem('token')}`
      }
    })
      .then(response => {
        if (!response.ok) {
          throw new Error('Gagal mengambil data siswa dari API');
        }

        return response.json();
      })
      .then(dataSiswa => {
        allDataSiswa = dataSiswa;
        currentData = allDataSiswa;

        generateTableRows(currentData);

        document.getElementById('search').addEventListener('input', function () {
          const query = this.value.toLowerCase();

          currentData = allDataSiswa.filter(student =>
            Object.values(student).some(val =>
              String(val).toLowerCase().includes(query)
            )
          );

          generateTableRows(currentData);
        });

        document.getElementById('tampil').addEventListener('change', function () {
          generateTableRows(currentData);
        });
      })
      .catch(error => {
        console.error('Error fetching data:', error);
      });

    window.showDetailSiswa = function (id) {
      window.location.href = `detail-data-siswa.html?id=${id}`;
    };

    window.hapusSiswa = async function (id) {
      const konfirmasi = confirm('Yakin ingin menghapus data siswa ini?');

      if (!konfirmasi) return;

      try {
        const response = await fetch(`/api/students/${id}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${localStorage.getItem('token')}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menghapus data siswa.');
          return;
        }

        alert('Data siswa berhasil dihapus.');
        location.reload();
      } catch (error) {
        console.error('DELETE STUDENT ERROR:', error);
        alert('Terjadi kesalahan saat menghapus data siswa.');
      }
    };

    window.updateRows = function () {
      generateTableRows(currentData);
    };
  });
</script>
<script src="/assets/js/sidebar.js"></script>
</body>
</html>
