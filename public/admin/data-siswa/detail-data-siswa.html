<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detail Data Siswa</title>
  <link rel="stylesheet" href="data-siswa.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Detail Data Siswa</h1>

      <button class="btn-back" onclick="window.history.back()">Back</button>

      <div class="detail-layout">
        <section class="student-card">
          <div class="photo-box" id="photoBox">
            <span>Foto</span>
          </div>

          <form id="studentEditForm">
            <div id="siswa-detail-container">
              <div>Memuat data siswa...</div>
            </div>

            <div id="btn-simpan-container">
              <button type="submit" class="btn-simpan">
                Simpan Perubahan
              </button>
            </div>
          </form>
        </section>

        <aside class="right-panel">
          <div id="level-record-container">
            <h2>Level Record</h2>

            <div class="level-tabs" id="levelTabs">
              <button class="level-tab active" type="button">-</button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>No.</th>
                  <th>Tanggal Kelas</th>
                  <th>Keterangan</th>
                </tr>
              </thead>

              <tbody id="levelRecordBody">
                <tr>
                  <td colspan="3">Memuat level record...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="credit-container">
            <div class="credit-section">
              <h2>Sisa Kredit</h2>
              <div>Memuat data kredit...</div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="/assets/js/auth-guard.js"></script>

  <script>
    let currentStudent = null;
    let currentLevelRecords = [];
    let activeLevelId = null;

    document.addEventListener('DOMContentLoaded', async function () {
      await loadStudentDetail();

      document.getElementById('studentEditForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        await saveStudentDetail();
      });
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    function getStudentIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function loadStudentDetail() {
      const siswaId = getStudentIdFromUrl();

      if (!siswaId) {
        document.getElementById('siswa-detail-container').innerHTML = `
          <div>ID siswa tidak ditemukan.</div>
        `;
        renderEmptyLevelRecord();
        return;
      }

      try {
        const response = await fetch(`/api/students/${siswaId}`, {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const siswa = await response.json();

        if (!response.ok) {
          console.error('DETAIL STUDENT ERROR:', siswa);
          document.getElementById('siswa-detail-container').innerHTML = `
            <div>${escapeHtml(siswa.message || 'Data siswa tidak ditemukan.')}</div>
          `;
          renderEmptyLevelRecord();
          return;
        }

        currentStudent = siswa;

        renderStudentForm(siswa);
        renderCreditInfo(siswa.levels || []);
        renderLevelTabs(siswa.levels || []);

        await loadLevelRecords(siswaId);
      } catch (error) {
        console.error('DETAIL STUDENT ERROR:', error);
        document.getElementById('siswa-detail-container').innerHTML = `
          <div>Data siswa tidak ditemukan.</div>
        `;
        renderEmptyLevelRecord();
      }
    }

    function renderStudentForm(siswa) {
      const container = document.getElementById('siswa-detail-container');
      const photoBox = document.getElementById('photoBox');

      if (siswa.photo) {
        photoBox.innerHTML = `
          <img 
            src="${escapeAttribute(siswa.photo)}" 
            alt="Foto siswa"
          >
          <div class="photo-overlay" onclick="document.getElementById('photo').click()">
            Ganti Foto
          </div>
        `;
      } else {
        photoBox.innerHTML = `
          <span>Foto</span>
          <div class="photo-overlay" onclick="document.getElementById('photo').click()">
            Upload Foto
          </div>
        `;
      }

      container.innerHTML = `
        <div class="detail-row">
          <span>Full Name</span>
          <input type="text" id="full_name" value="${escapeAttribute(siswa.full_name || '')}" />
        </div>

        <div class="detail-row">
          <span>Nickname</span>
          <input type="text" id="nickname" value="${escapeAttribute(siswa.nickname || '')}" />
        </div>

        <div class="detail-row">
          <span>Parent Name</span>
          <input type="text" id="parent_name" value="${escapeAttribute(siswa.parent_name || '')}" />
        </div>

        <div class="detail-row">
          <span>Born Date</span>
          <input type="date" id="born_date" value="${dateForInput(siswa.born_date)}" />
        </div>

        <div class="detail-row">
          <span>Age</span>
          <input type="number" id="age" value="${escapeAttribute(siswa.age ?? '')}" />
        </div>

        <div class="detail-row">
          <span>Tgl. Bergabung</span>
          <input type="date" id="joined_date" value="${dateForInput(siswa.joined_date)}" />
        </div>

        <div class="detail-row">
          <span>Lama Bergabung</span>
          <input type="text" id="duration" value="${escapeAttribute(siswa.duration || '')}" />
        </div>

        <div class="detail-row">
          <span>Kelas Awal</span>
          <input type="text" id="initial_class" value="${escapeAttribute(siswa.initial_class || '')}" />
        </div>

        <div class="detail-row">
          <span>Kelas Sekarang</span>
          <input type="text" id="current_class" value="${escapeAttribute(siswa.current_class || '')}" />
        </div>

        <div class="detail-row">
          <span>No. Telp</span>
          <input type="text" id="phone" value="${escapeAttribute(siswa.phone || '')}" />
        </div>

        <div class="detail-row">
          <span>Kota</span>
          <input type="text" id="city" value="${escapeAttribute(siswa.city || '')}" />
        </div>

        <div class="detail-row">
          <span>Sekolah</span>
          <input type="text" id="school" value="${escapeAttribute(siswa.school || '')}" />
        </div>

        <div class="detail-row">
          <span>Alamat</span>
          <input type="text" id="address" value="${escapeAttribute(siswa.address || '')}" />
        </div>

        <div class="detail-row">
          <span>Email</span>
          <input type="email" id="email" value="${escapeAttribute(siswa.email || '')}" />
        </div>

        <div class="detail-row">
          <span>Google Maps</span>
          <input type="text" id="gmaps" value="${escapeAttribute(siswa.gmaps || '')}" />
        </div>

        <input type="file" id="photo" class="hidden-photo-input" accept="image/*" />
      `;

      const photoInput = document.getElementById('photo');

      photoInput.addEventListener('change', function () {
        const file = this.files[0];

        if (!file) return;

        const previewUrl = URL.createObjectURL(file);

        photoBox.innerHTML = `
          <img 
            src="${previewUrl}" 
            alt="Preview foto siswa"
          >
          <div class="photo-overlay" onclick="document.getElementById('photo').click()">
            Ganti Foto
          </div>
        `;
      });
    }

    async function saveStudentDetail() {
      const siswaId = getStudentIdFromUrl();

      const fullName = document.getElementById('full_name').value.trim();

      if (!fullName) {
        alert('Full Name wajib diisi.');
        return;
      }

      const confirmed = confirm('Yakin ingin menyimpan perubahan data siswa?');

      if (!confirmed) return;

      const formData = new FormData();

      formData.append('full_name', fullName);
      formData.append('nickname', document.getElementById('nickname').value.trim());
      formData.append('parent_name', document.getElementById('parent_name').value.trim());
      formData.append('born_date', document.getElementById('born_date').value);
      formData.append('age', document.getElementById('age').value);
      formData.append('joined_date', document.getElementById('joined_date').value);
      formData.append('duration', document.getElementById('duration').value.trim());
      formData.append('initial_class', document.getElementById('initial_class').value.trim());
      formData.append('current_class', document.getElementById('current_class').value.trim());
      formData.append('phone', document.getElementById('phone').value.trim());
      formData.append('city', document.getElementById('city').value.trim());
      formData.append('school', document.getElementById('school').value.trim());
      formData.append('address', document.getElementById('address').value.trim());
      formData.append('email', document.getElementById('email').value.trim());
      formData.append('gmaps', document.getElementById('gmaps').value.trim());

      const photoInput = document.getElementById('photo');

      if (photoInput.files.length > 0) {
        formData.append('photo', photoInput.files[0]);
      }

      try {
        const response = await fetch(`/api/students/${siswaId}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${getToken()}`
          },
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal memperbarui data siswa.');
          return;
        }

        alert(result.message || 'Data siswa berhasil diperbarui.');
        await loadStudentDetail();
      } catch (error) {
        console.error('UPDATE STUDENT ERROR:', error);
        alert('Terjadi kesalahan saat memperbarui data siswa.');
      }
    }

    function renderCreditInfo(levels) {
      const creditContainer = document.getElementById('credit-container');

      if (!creditContainer) return;

      if (!levels || levels.length === 0) {
        creditContainer.innerHTML = `
          <div class="credit-section">
            <h2>Sisa Kredit</h2>
            <div>Belum ada data kredit.</div>
          </div>
        `;
        return;
      }

      const creditRows = levels.map(level => `
        <div class="credit-row">
          <span>${escapeHtml(level.level_name || '-')}</span>
          <strong>:</strong>
          <b>${escapeHtml(level.remaining_credit ?? '-')}</b>
        </div>
      `).join('');

      const expiredRows = levels.map(level => `
        <div class="credit-row">
          <span>${escapeHtml(level.level_name || '-')}</span>
          <strong>:</strong>
          <b>${formatDate(level.latest_expired_at)}</b>
        </div>
      `).join('');

      creditContainer.innerHTML = `
        <div class="credit-section">
          <h2>Sisa Kredit</h2>
          ${creditRows}
        </div>

        <div class="credit-section">
          <h2>Tanggal Expired</h2>
          ${expiredRows}
        </div>
      `;
    }

    function renderLevelTabs(levels) {
      const tabsContainer = document.getElementById('levelTabs');

      if (!tabsContainer) return;

      if (!levels || levels.length === 0) {
        tabsContainer.innerHTML = `<button type="button" class="level-tab active">-</button>`;
        activeLevelId = null;
        return;
      }

      activeLevelId = Number(levels[0].level_id);

      tabsContainer.innerHTML = levels.map((level, index) => {
        return `
          <button
            type="button"
            class="level-tab ${index === 0 ? 'active' : ''}"
            data-level-id="${level.level_id}"
            onclick="setActiveLevel(${level.level_id})"
          >
            ${escapeHtml(level.level_name || '-')}
          </button>
        `;
      }).join('');
    }

    function setActiveLevel(levelId) {
      activeLevelId = Number(levelId);

      document.querySelectorAll('.level-tab').forEach(button => {
        button.classList.toggle(
          'active',
          Number(button.dataset.levelId) === Number(levelId)
        );
      });

      renderLevelRecords(currentLevelRecords);
    }

    async function loadLevelRecords(studentId) {
      try {
        const response = await fetch('/api/summaries', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET SUMMARIES ERROR:', result);
          currentLevelRecords = [];
          renderLevelRecords(currentLevelRecords);
          return;
        }

        const summaries = Array.isArray(result) ? result : [];

        currentLevelRecords = summaries.filter(summary => {
          return Number(summary.student_id) === Number(studentId)
            && summary.status === 'terkirim';
        });

        renderLevelRecords(currentLevelRecords);
      } catch (error) {
        console.error('LOAD LEVEL RECORD ERROR:', error);
        currentLevelRecords = [];
        renderLevelRecords(currentLevelRecords);
      }
    }

    function renderLevelRecords(records) {
      const recordBody = document.getElementById('levelRecordBody');

      if (!recordBody) return;

      const filteredRecords = (records || []).filter(record => {
        if (!activeLevelId) return true;
        return Number(record.level_id) === Number(activeLevelId);
      });

      if (filteredRecords.length === 0) {
        recordBody.innerHTML = `
          <tr>
            <td colspan="3">Belum ada level record.</td>
          </tr>
        `;
        return;
      }

      recordBody.innerHTML = filteredRecords.map((record, index) => {
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${formatDate(record.class_date)}</td>
            <td>${escapeHtml(record.keterangan || record.summary_text || '-')}</td>
          </tr>
        `;
      }).join('');
    }

    function renderEmptyLevelRecord() {
      const recordBody = document.getElementById('levelRecordBody');
      const tabsContainer = document.getElementById('levelTabs');

      if (tabsContainer) {
        tabsContainer.innerHTML = `<button type="button" class="level-tab active">-</button>`;
      }

      if (recordBody) {
        recordBody.innerHTML = `
          <tr>
            <td colspan="3">Belum ada level record.</td>
          </tr>
        `;
      }
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function dateForInput(dateValue) {
      if (!dateValue) return '';

      if (typeof dateValue === 'string') {
        return dateValue.slice(0, 10);
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return '';
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>

  <script src="/assets/js/sidebar.js"></script>
</body>
</html>
