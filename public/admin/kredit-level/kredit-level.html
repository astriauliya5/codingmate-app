<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Kredit</title>
  <link rel="stylesheet" href="kredit-level.css" />
    <link rel="stylesheet" href="../../assets/css/index.css" />
</head>
<body>
  <div class="container">
    <div id="sidebar-container"></div>
    <main class="main-content">
    <h1>Pembelian Kredit</h1>

    <div class="top-action">
        <div>
          <button class="btn" onclick="window.location.href='form-pembelian.html'">+ Tambah Pembelian Kredit</button>
          <button class="btn" onclick="window.location.href='level-harga.html'">Level dan Harga</button>
        </div>

        <div class="search-box">
          <input type="text" id="search" placeholder="🔍 Search">

          <label>
            Tampilkan
            <select id="tampil">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            entri
          </label>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
        <thead>
            <tr>
            <th>No</th>
            <th>Aksi</th>
            <th>No. Invoice</th>
            <th>Nama Siswa</th>
            <th>Nama Level</th>
            <th>Jenis Kelas</th>
            <th>Paid For (Kredit)</th>
            <th>Tgl. Invoice</th>
            <th>Harga Level</th>
            <th>Total</th>
            <th>Status</th>
            <th>Tgl. Bayar</th>
            <th>Tgl. Kelas Pertama</th>
            <th>Sisa Kredit</th>
            <th>Tgl. Expired</th>
            </tr>
        </thead>

        <tbody id="purchase-table-body">
                <!-- generated by js -->
        </tbody>
        </table>
    </div>
    </main>
  </div>
</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const tableBody = document.getElementById('purchase-table-body');
    const searchInput = document.getElementById('search');
    const tampilSelect = document.getElementById('tampil');

    let invoiceData = [];
    let currentData = [];

    fetchInvoices();

    function getToken() {
      return localStorage.getItem('token');
    }

    function formatRupiah(number) {
      return 'Rp. ' + Number(number || 0).toLocaleString('id-ID');
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function getStatusClass(status) {
      if (status === 'pending') return 'pending';
      if (status === 'invoice belum dikirim') return 'unpaid';
      if (status === 'lunas') return 'paid';
      return 'pending';
    }

    async function fetchInvoices() {
      try {
        const response = await fetch('/api/invoices', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal mengambil data pembelian kredit.');
          return;
        }

        invoiceData = result;
        currentData = invoiceData;

        renderPurchaseTable(currentData);
      } catch (error) {
        console.error('GET INVOICES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data pembelian kredit.');
      }
    }

    function renderPurchaseTable(data) {
      tableBody.innerHTML = '';

      const jumlahTampil = tampilSelect ? Number(tampilSelect.value) : data.length;
      const slicedData = data.slice(0, jumlahTampil);

      if (slicedData.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="15">Belum ada data pembelian kredit.</td>
          </tr>
        `;
        return;
      }

      slicedData.forEach((item, index) => {
        const isPaid = item.status === 'lunas';

        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>

          <td>
            ${
              isPaid
                ? ''
                : `<button class="btn-delete" onclick="deleteInvoice(${item.invoice_id})">✖ Hapus</button>`
            }

            <button class="btn-pdf" onclick="openInvoicePreview(${item.invoice_id})">
              📥 Download Pdf
            </button>
          </td>

          <td>${item.invoice_no || '-'}</td>
          <td>${item.student_name || '-'}</td>
          <td>${item.level_name || '-'}</td>
          <td>${item.class_type || '-'}</td>
          <td>${item.credit_amount || 0} Kredit</td>
          <td>${formatDate(item.invoice_date)}</td>
          <td>${formatRupiah(item.price_per_credit)}</td>
          <td>${formatRupiah(item.subtotal)}</td>

          <td>
            <select 
              class="status ${getStatusClass(item.status)}" 
              onchange="updateInvoiceStatus(${item.invoice_id}, this.value)"
              ${isPaid ? 'disabled' : ''}
            >
              <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="invoice belum dikirim" ${item.status === 'invoice belum dikirim' ? 'selected' : ''}>Invoice Belum Dikirim</option>
              <option value="lunas" ${item.status === 'lunas' ? 'selected' : ''}>Lunas</option>
            </select>
          </td>

          <td>${formatDate(item.paid_at)}</td>
          <td>-</td>
          <td>${item.remaining_credit ?? '-'}</td>
          <td>${formatDate(item.latest_expired_at)}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    function filterInvoices() {
      const query = searchInput ? searchInput.value.toLowerCase() : '';

      currentData = invoiceData.filter(item => {
        return Object.values(item).some(value =>
          String(value).toLowerCase().includes(query)
        );
      });

      renderPurchaseTable(currentData);
    }

    if (searchInput) {
      searchInput.addEventListener('input', filterInvoices);
    }

    if (tampilSelect) {
      tampilSelect.addEventListener('change', function () {
        renderPurchaseTable(currentData);
      });
    }

    window.updateInvoiceStatus = async function (invoiceId, status) {
      const confirmUpdate = confirm(`Yakin ingin mengubah status invoice menjadi "${status}"?`);

      if (!confirmUpdate) {
        fetchInvoices();
        return;
      }

      try {
        const response = await fetch(`/api/invoices/${invoiceId}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify({
            status: status
          })
        });

        const result = await response.json();

if (!response.ok) {
  alert(result.error || result.message || 'Gagal mengubah status invoice.');
  console.error('STATUS UPDATE ERROR:', result);
  fetchInvoices();
  return;
}

        alert(result.message || 'Status invoice berhasil diperbarui.');
        fetchInvoices();
      } catch (error) {
        console.error('UPDATE STATUS ERROR:', error);
        alert('Terjadi kesalahan saat mengubah status invoice.');
        fetchInvoices();
      }
    };

    window.deleteInvoice = async function (invoiceId) {
      const confirmDelete = confirm('Yakin ingin menghapus invoice ini?');

      if (!confirmDelete) return;

      try {
        const response = await fetch(`/api/invoices/${invoiceId}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menghapus invoice.');
          return;
        }

        alert('Invoice berhasil dihapus.');
        fetchInvoices();
      } catch (error) {
        console.error('DELETE INVOICE ERROR:', error);
        alert('Terjadi kesalahan saat menghapus invoice.');
      }
    };

    window.openInvoicePreview = function (invoiceId) {
      window.location.href = `/admin/kredit-level/invoice.html?id=${invoiceId}`;
    };
  });
</script>
<script src="/assets/js/auth-guard.js"></script>
<script src="../../assets/js/sidebar.js"></script>
