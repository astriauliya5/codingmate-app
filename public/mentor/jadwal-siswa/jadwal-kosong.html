<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jadwal Kosong Mentor</title>
  <link rel="stylesheet" href="jadwal-mentor.css" />
  <link rel="stylesheet" href="../../assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Jadwal</h1>

      <a class="btn-pengaturan" href="pengaturan-jadwal.html">Pengaturan Jadwal</a>

      <div class="top-bar">
        <div class="tabs">
          <a href="jadwal-siswa.html" class="tab">Jadwal Siswa</a>
          <a href="jadwal-kosong.html" class="tab active">Jadwal Kosong</a>
          <a href="jadwal-all.html" class="tab">All</a>
        </div>
      </div>

      <div class="jadwal-wrapper">
        <div id="info-popup" class="info-popup">
          💡 Centang untuk menandai jadwal kosong anda
        </div>

        <div class="navigation">
          <button type="button" id="prevWeekBtn">&larr; Previous Week</button>
          <input type="text" id="weekLabel" placeholder="APRIL 2025" disabled />
          <button type="button" id="nextWeekBtn">Next Week &rarr;</button>
        </div>

        <table class="jadwal-table jadwal-kosong-table">
          <thead>
            <tr>
              <th>Senin</th>
              <th class="date-head" data-day="0">dd/mm/yyyy</th>

              <th>Selasa</th>
              <th class="date-head" data-day="1">dd/mm/yyyy</th>

              <th>Rabu</th>
              <th class="date-head" data-day="2">dd/mm/yyyy</th>

              <th>Kamis</th>
              <th class="date-head" data-day="3">dd/mm/yyyy</th>

              <th>Jumat</th>
              <th class="date-head" data-day="4">dd/mm/yyyy</th>

              <th>Sabtu</th>
              <th class="date-head" data-day="5">dd/mm/yyyy</th>
            </tr>
          </thead>

          <tbody id="jadwal-body"></tbody>
        </table>

        <div class="save-wrapper">
          <button type="button" class="btn-save-jadwal" onclick="saveJadwalKosong()">
            Simpan Perubahan
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentWeekStart = getMonday(new Date());

    // Key: YYYY-MM-DD|HH:MM
    // Value: { id, available_date, start_time }
    let initialEmptySlotMap = new Map();

    const currentMentorClass = 'mentor1';

    document.addEventListener('DOMContentLoaded', async function () {
      setupWeekNavigation();
      renderWeekHeader();
      generateJadwalRows(7, 19);
      showInfoPopup();

      await loadWeeklyMentorEmptySchedules();
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    function getCurrentUserId() {
      try {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        return currentUser?.id || null;
      } catch (error) {
        return null;
      }
    }

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);

      return d;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function addWeeks(date, weeks) {
      const result = new Date(date);
      result.setDate(result.getDate() + (weeks * 7));
      return result;
    }

    function toDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function normalizeDateValue(dateValue) {
      if (!dateValue) return '';

      if (typeof dateValue === 'string') {
        return dateValue.slice(0, 10);
      }

      return toDateString(new Date(dateValue));
    }

    function formatDateHeader(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function formatMonthYear(date) {
      const monthNames = [
        'JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI',
        'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'
      ];

      return `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    }

    function renderWeekHeader() {
      const weekLabel = document.getElementById('weekLabel');
      const dateHeads = document.querySelectorAll('.date-head');

      if (weekLabel) {
        weekLabel.value = formatMonthYear(currentWeekStart);
      }

      dateHeads.forEach((th, index) => {
        const date = addDays(currentWeekStart, index);
        th.textContent = formatDateHeader(date);
      });
    }

    function setupWeekNavigation() {
      const prevBtn = document.getElementById('prevWeekBtn');
      const nextBtn = document.getElementById('nextWeekBtn');

      if (prevBtn) {
        prevBtn.addEventListener('click', async function () {
          currentWeekStart = addWeeks(currentWeekStart, -1);
          renderWeekHeader();
          generateJadwalRows(7, 19);
          await loadWeeklyMentorEmptySchedules();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', async function () {
          currentWeekStart = addWeeks(currentWeekStart, 1);
          renderWeekHeader();
          generateJadwalRows(7, 19);
          await loadWeeklyMentorEmptySchedules();
        });
      }
    }

    function generateJadwalRows(startHour, endHour) {
      const tbody = document.getElementById('jadwal-body');
      const intervals = ['00', '30'];
      let rowIndex = 0;

      tbody.innerHTML = '';

      for (let hour = startHour; hour <= endHour; hour++) {
        for (let i = 0; i < intervals.length; i++) {
          const jam = `${hour}.${intervals[i]}`;

          if (hour === endHour && intervals[i] === '30') break;

          const rowColorClass = rowIndex % 2 === 0 ? 'row-yellow' : 'row-white';

          const row = document.createElement('tr');
          row.classList.add('main-row', rowColorClass);

          for (let day = 0; day < 6; day++) {
            row.innerHTML += `
              <td class="time-cell">${jam}</td>
              <td class="slot default-slot" data-day="${day}" data-time="${jam}">
                <input 
                  type="checkbox" 
                  class="slot-checkbox" 
                  data-day="${day}" 
                  data-time="${jam}"
                >
              </td>
            `;
          }

          tbody.appendChild(row);
          rowIndex++;
        }
      }

      handleCheckboxChange();
    }

    async function loadWeeklyMentorEmptySchedules() {
      try {
        initialEmptySlotMap = new Map();

        await markFilledSchedulesIfAvailable();
        await loadSavedEmptySchedules();
      } catch (error) {
        console.error('LOAD WEEKLY MENTOR EMPTY SCHEDULES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil jadwal kosong mentor.');
      }
    }

    async function markFilledSchedulesIfAvailable() {
      try {
        const weekStart = toDateString(currentWeekStart);
        const mentorId = getCurrentUserId();

        const response = await fetch(`/api/schedules/week?week_start=${weekStart}`, {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        if (!response.ok) {
          console.warn('Jadwal terisi tidak bisa dimuat. Validasi bentrok tetap diamankan backend.');
          return;
        }

        const result = await response.json();

        const schedules = Array.isArray(result) ? result : [];

        const filteredSchedules = schedules.filter(schedule => {
          if (!mentorId || !schedule.mentor_id) return true;
          return Number(schedule.mentor_id) === Number(mentorId);
        });

        filteredSchedules.forEach(schedule => {
          const day = Number(schedule.day_of_week);

          if (day < 0 || day > 5) return;

          const start = timeToMinutes(formatTimeForTable(schedule.start_time));
          const end = timeToMinutes(formatTimeForTable(schedule.end_time));

          document
            .querySelectorAll(`.slot[data-day="${day}"]`)
            .forEach(cell => {
              const cellTime = timeToMinutes(cell.dataset.time);

              if (cellTime >= start && cellTime < end) {
                cell.classList.remove('default-slot');
                cell.classList.add(`filled-${currentMentorClass}`);

                const checkbox = cell.querySelector('.slot-checkbox');

                if (checkbox) {
                  checkbox.checked = false;
                  checkbox.disabled = true;
                  checkbox.title = 'Slot ini sudah terisi jadwal kelas';
                }
              }
            });
        });
      } catch (error) {
        console.warn('Gagal memuat jadwal terisi. Validasi bentrok tetap diamankan backend.', error);
      }
    }

    async function loadSavedEmptySchedules() {
      const weekStart = toDateString(currentWeekStart);
      const mentorId = getCurrentUserId();

      const response = await fetch(`/api/empty-schedules/week?week_start=${weekStart}`, {
        headers: {
          Authorization: `Bearer ${getToken()}`
        }
      });

      const result = await response.json();

      if (!response.ok) {
        console.error('GET MENTOR EMPTY SCHEDULES ERROR:', result);
        alert(result.message || result.error || 'Gagal mengambil jadwal kosong mentor.');
        return;
      }

      const schedules = Array.isArray(result) ? result : [];

      const filteredSchedules = schedules.filter(schedule => {
        if (!mentorId || !schedule.mentor_id) return true;
        return Number(schedule.mentor_id) === Number(mentorId);
      });

      filteredSchedules.forEach(schedule => {
        const dateValue = normalizeDateValue(schedule.available_date || schedule.date);
        const startTime = formatTimeForApi(schedule.start_time);
        const tableTime = formatTimeForTable(schedule.start_time);
        const day = Number(schedule.day_of_week);

        if (day < 0 || day > 5) return;

        const key = makeSlotKey(dateValue, startTime);

        initialEmptySlotMap.set(key, {
          id: schedule.id,
          available_date: dateValue,
          start_time: startTime
        });

        const cell = document.querySelector(
          `.slot[data-day="${day}"][data-time="${tableTime}"]`
        );

        if (!cell) return;

        const checkbox = cell.querySelector('.slot-checkbox');

        // Kalau slot sudah terisi kelas, jangan tandai sebagai kosong.
        // Data lama yang bentrok bisa hilang saat user klik Simpan Perubahan.
        if (checkbox && checkbox.disabled) {
          return;
        }

        cell.classList.remove('default-slot');
        cell.classList.add(`empty-${currentMentorClass}`);

        if (checkbox) {
          checkbox.checked = true;
        }
      });
    }

    function handleCheckboxChange() {
      document.querySelectorAll('.slot-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
          const cell = this.closest('.slot');

          if (this.disabled) return;

          if (this.checked) {
            cell.classList.remove('default-slot');
            cell.classList.add(`empty-${currentMentorClass}`);
          } else {
            cell.classList.remove(`empty-${currentMentorClass}`);
            cell.classList.add('default-slot');
          }
        });
      });
    }

    function collectCheckedSlotMap() {
      const checkedSlotMap = new Map();

      document.querySelectorAll('.slot-checkbox:checked:not(:disabled)').forEach(checkbox => {
        const day = Number(checkbox.dataset.day);
        const date = toDateString(addDays(currentWeekStart, day));
        const startTime = formatTimeForApi(checkbox.dataset.time);
        const key = makeSlotKey(date, startTime);

        checkedSlotMap.set(key, {
          available_date: date,
          start_time: startTime
        });
      });

      return checkedSlotMap;
    }

    async function saveJadwalKosong() {
      try {
        const checkedSlotMap = collectCheckedSlotMap();

        const slotsToCreate = [];

        checkedSlotMap.forEach((slot, key) => {
          if (!initialEmptySlotMap.has(key)) {
            slotsToCreate.push(slot);
          }
        });

        const idsToDelete = [];

        initialEmptySlotMap.forEach((slot, key) => {
          if (!checkedSlotMap.has(key)) {
            idsToDelete.push(slot.id);
          }
        });

        if (slotsToCreate.length === 0 && idsToDelete.length === 0) {
          alert('Tidak ada perubahan jadwal kosong.');
          return;
        }

        let insertedCount = 0;
        let skippedCount = 0;

        if (slotsToCreate.length > 0) {
          const createResponse = await fetch('/api/empty-schedules', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${getToken()}`
            },
            body: JSON.stringify({
              slots: slotsToCreate
            })
          });

          const createResult = await createResponse.json();

          if (!createResponse.ok) {
            console.error('CREATE EMPTY SCHEDULE ERROR:', createResult);
            alert(createResult.message || createResult.error || 'Gagal menyimpan jadwal kosong.');
            return;
          }

          insertedCount = Number(createResult.inserted_count || 0);
          skippedCount = Number(createResult.skipped_count || 0);
        }

        if (idsToDelete.length > 0) {
          for (const id of idsToDelete) {
            const deleteResponse = await fetch(`/api/empty-schedules/${id}`, {
              method: 'DELETE',
              headers: {
                Authorization: `Bearer ${getToken()}`
              }
            });

            const deleteResult = await deleteResponse.json();

            if (!deleteResponse.ok) {
              console.error('DELETE EMPTY SCHEDULE ERROR:', deleteResult);
              alert(deleteResult.message || deleteResult.error || 'Gagal menghapus jadwal kosong.');
              return;
            }
          }
        }

        let message = 'Perubahan jadwal kosong berhasil disimpan.';

        if (slotsToCreate.length > 0) {
          message += `\nBerhasil ditambahkan: ${insertedCount}`;
          message += `\nDilewati karena bentrok/duplikat: ${skippedCount}`;
        }

        if (idsToDelete.length > 0) {
          message += `\nBerhasil dihapus: ${idsToDelete.length}`;
        }

        alert(message);

        generateJadwalRows(7, 19);
        await loadWeeklyMentorEmptySchedules();
      } catch (error) {
        console.error('SAVE JADWAL KOSONG ERROR:', error);
        alert('Terjadi kesalahan saat menyimpan perubahan jadwal kosong.');
      }
    }

    function makeSlotKey(date, time) {
      return `${date}|${time}`;
    }

    function formatTimeForApi(timeValue) {
      if (!timeValue) return '';

      const timeString = String(timeValue);

      if (timeString.includes(':')) {
        const [hour, minute] = timeString.split(':');
        return `${String(Number(hour)).padStart(2, '0')}:${minute}`;
      }

      if (timeString.includes('.')) {
        const [hour, minute] = timeString.split('.');
        return `${String(Number(hour)).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
      }

      return timeString;
    }

    function formatTimeForTable(timeValue) {
      if (!timeValue) return '';

      const timeString = String(timeValue);

      if (timeString.includes(':')) {
        const [hour, minute] = timeString.split(':');
        return `${Number(hour)}.${minute}`;
      }

      return timeString;
    }

    function timeToMinutes(timeStr) {
      const [hour, minute] = String(timeStr).split('.').map(Number);
      return (hour * 60) + minute;
    }

    function showInfoPopup() {
      const popup = document.getElementById('info-popup');

      setTimeout(() => {
        popup.classList.add('show');
      }, 300);

      setTimeout(() => {
        popup.classList.remove('show');
      }, 4500);
    }
  </script>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="../../assets/js/sidebar-mentor.js"></script>
</body>
</html>
