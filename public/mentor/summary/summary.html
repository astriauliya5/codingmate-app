<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Summary Mentor</title>
  <link rel="stylesheet" href="summary.css" />
  <link rel="stylesheet" href="../../assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Summary Class</h1>

      <div class="summary-action-row">
        <button class="btn-primary" onclick="window.location.href='tambah-summary.html'">
          + Tambah Summary
        </button>

        <div class="summary-control">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search">
          </div>

          <div class="entry-box">
            <label>
              Tampilkan
              <select id="entrySelect">
                <option>4</option>
                <option>10</option>
                <option>25</option>
                <option>50</option>
              </select>
              entri
            </label>
          </div>
        </div>
      </div>

      <div class="summary-table-wrapper">
        <table class="summary-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>Id</th>
              <th>Full Name</th>
              <th>Nickname</th>
              <th>Level</th>
              <th>Tanggal Kelas</th>
              <th>Keterangan</th>
              <th>Summary</th>
              <th>Status</th>
              <th>Jenis Kelas</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody id="summaryBody">
            <tr>
              <td colspan="11">Memuat data summary...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    let allSummaries = [];

    document.addEventListener('DOMContentLoaded', async function () {
      await loadMentorSummaries();

      const searchInput = document.getElementById('searchInput');
      const entrySelect = document.getElementById('entrySelect');

      if (searchInput) {
        searchInput.addEventListener('input', renderMentorSummaries);
      }

      if (entrySelect) {
        entrySelect.addEventListener('change', renderMentorSummaries);
      }
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    async function loadMentorSummaries() {
      try {
        const response = await fetch('/api/summaries/mentor', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET MENTOR SUMMARIES ERROR:', result);
          alert(result.message || 'Gagal mengambil data summary mentor.');
          return;
        }

        allSummaries = result;
        renderMentorSummaries();
      } catch (error) {
        console.error('LOAD MENTOR SUMMARIES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data summary mentor.');
      }
    }

    function renderMentorSummaries() {
      const tbody = document.getElementById('summaryBody');
      const searchValue = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const limit = Number(document.getElementById('entrySelect')?.value || 4);

      if (!tbody) return;

      let filteredSummaries = allSummaries.filter(summary => {
        const combinedText = [
          summary.id,
          summary.full_name,
          summary.nickname,
          summary.level_name,
          summary.class_date,
          summary.keterangan,
          summary.summary_text,
          summary.status,
          summary.class_type
        ].join(' ').toLowerCase();

        return combinedText.includes(searchValue);
      });

      filteredSummaries = filteredSummaries.slice(0, limit);

      if (filteredSummaries.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11">Belum ada data summary.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filteredSummaries.map((summary, index) => {
        const isSent = summary.status === 'terkirim';

        return `
          <tr>
            <td>${index + 1}</td>
            <td>${summary.id}</td>
            <td>${escapeHtml(summary.full_name || '-')}</td>
            <td>${escapeHtml(summary.nickname || '-')}</td>
            <td>${escapeHtml(summary.level_name || '-')}</td>
            <td>${formatDate(summary.class_date)}</td>
            <td>${escapeHtml(summary.keterangan || '-')}</td>
            <td>${escapeHtml(summary.summary_text || '-')}</td>
            <td>
              <span class="status-badge ${isSent ? 'sent' : 'pending'}">
                ${isSent ? 'Terkirim' : 'Pending'}
              </span>
            </td>
            <td>${formatClassType(summary.class_type)}</td>
            <td>
              ${!isSent ? `<button class="btn-delete" onclick="deleteSummary(${summary.id})">✖ Hapus</button>` : ''}
              <button class="btn-detail" onclick="openSummaryDetail(${summary.id})">Detail</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function deleteSummary(summaryId) {
      const confirmed = confirm('Yakin ingin menghapus summary ini?');

      if (!confirmed) return;

      try {
        const response = await fetch(`/api/summaries/${summaryId}`, {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menghapus summary.');
          return;
        }

        alert(result.message || 'Summary berhasil dihapus.');
        await loadMentorSummaries();
      } catch (error) {
        console.error('DELETE SUMMARY ERROR:', error);
        alert('Terjadi kesalahan saat menghapus summary.');
      }
    }

    function openSummaryDetail(summaryId) {
      window.location.href = `detail-summary.html?id=${summaryId}`;
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function formatClassType(classType) {
      if (!classType) return '-';

      if (classType === 'reguler') return 'Reguler';
      if (classType === 'trial') return 'Trial';

      return classType;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="../../assets/js/sidebar-mentor.js"></script>
</body>
</html>
