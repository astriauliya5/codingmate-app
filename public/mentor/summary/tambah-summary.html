<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Summary</title>
  <link rel="stylesheet" href="summary.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Tambah Summary</h1>

      <button class="btn-back" onclick="window.history.back()">Back</button>

      <form class="summary-form" id="summaryForm">
        <div class="form-group">
          <label for="nama-siswa">Nama Siswa</label>
          <select id="nama-siswa" name="namaSiswa" required>
            <option value="">Pilih siswa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="level">Level</label>
          <select id="level" name="level" required>
            <option value="">Pilih siswa terlebih dahulu</option>
          </select>
        </div>

        <div class="form-group form-date">
          <label for="tanggal-kelas">Tanggal Kelas</label>
          <select id="tanggal-kelas" name="tanggalKelas" required>
            <option value="">Pilih siswa dan level terlebih dahulu</option>
          </select>
        </div>

        <div class="form-group">
          <label for="jenis-kelas">Jenis Kelas</label>
          <select id="jenis-kelas" name="jenisKelas" required>
            <option value="">Pilih tanggal kelas terlebih dahulu</option>
            <option value="reguler">Reguler</option>
            <option value="trial">Trial</option>
          </select>
        </div>

        <div class="form-group">
          <label for="detail-summary">Detail Summary</label>
          <textarea id="detail-summary" name="detailSummary" placeholder="Isi detail pembelajaran hari ini" required></textarea>
        </div>

        <div class="form-group">
          <label for="keterangan">Keterangan</label>
          <input type="text" id="keterangan" name="keterangan" placeholder="Contoh: Hadir / Izin / Bagus" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-form" onclick="window.history.back()">Cancel</button>
          <button type="submit" class="btn-form">Save</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    let summaryOptions = [];

    document.addEventListener('DOMContentLoaded', async function () {
      await loadSummaryOptions();

      const studentSelect = document.getElementById('nama-siswa');
      const levelSelect = document.getElementById('level');
      const classDateSelect = document.getElementById('tanggal-kelas');

      studentSelect.addEventListener('change', function () {
        renderLevelOptions(this.value);
        resetClassDateOptions();
        resetClassType();
      });

      levelSelect.addEventListener('change', async function () {
        const studentId = studentSelect.value;
        const levelId = this.value;

        resetClassDateOptions();
        resetClassType();

        if (!studentId || !levelId) return;

        await loadClassDates(studentId, levelId);
      });

      classDateSelect.addEventListener('change', function () {
        const selectedOption = this.options[this.selectedIndex];
        const classType = selectedOption?.dataset?.classType || '';

        const classTypeSelect = document.getElementById('jenis-kelas');

        if (classType) {
          classTypeSelect.value = classType;
        } else {
          classTypeSelect.value = '';
        }
      });

      document.getElementById('summaryForm').addEventListener('submit', submitSummary);
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    async function loadSummaryOptions() {
      try {
        const response = await fetch('/api/summaries/mentor/options', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET SUMMARY OPTIONS ERROR:', result);
          alert(result.message || 'Gagal mengambil pilihan siswa.');
          return;
        }

        summaryOptions = Array.isArray(result) ? result : [];
        renderStudentOptions();
      } catch (error) {
        console.error('LOAD SUMMARY OPTIONS ERROR:', error);
        alert('Terjadi kesalahan saat mengambil pilihan siswa.');
      }
    }

    function renderStudentOptions() {
      const studentSelect = document.getElementById('nama-siswa');

      const students = [];

      summaryOptions.forEach(item => {
        const existing = students.find(student => Number(student.id) === Number(item.student_id));

        if (!existing) {
          students.push({
            id: item.student_id,
            full_name: item.full_name,
            nickname: item.nickname
          });
        }
      });

      if (students.length === 0) {
        studentSelect.innerHTML = `<option value="">Belum ada siswa dengan kredit aktif</option>`;
        renderLevelOptions('');
        return;
      }

      studentSelect.innerHTML = `
        <option value="">Pilih siswa</option>
        ${students.map(student => {
          return `
            <option value="${student.id}">
              ${escapeHtml(student.full_name || '-')}
            </option>
          `;
        }).join('')}
      `;
    }

    function renderLevelOptions(studentId) {
      const levelSelect = document.getElementById('level');

      const levels = summaryOptions.filter(item => {
        return Number(item.student_id) === Number(studentId);
      });

      if (levels.length === 0) {
        levelSelect.innerHTML = `<option value="">Pilih level</option>`;
        return;
      }

      levelSelect.innerHTML = `
        <option value="">Pilih level</option>
        ${levels.map(level => {
          return `
            <option value="${level.level_id}">
              ${escapeHtml(level.level_name || '-')} - Sisa ${level.remaining_credit} sesi
            </option>
          `;
        }).join('')}
      `;
    }

    async function loadClassDates(studentId, levelId) {
      const classDateSelect = document.getElementById('tanggal-kelas');

      classDateSelect.innerHTML = `<option value="">Memuat tanggal kelas...</option>`;

      try {
        const response = await fetch(`/api/summaries/mentor/class-dates?student_id=${studentId}&level_id=${levelId}`, {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET CLASS DATES ERROR:', result);
          alert(result.message || 'Gagal mengambil tanggal kelas.');
          resetClassDateOptions('Gagal memuat tanggal kelas');
          return;
        }

        const options = result.class_dates || [];

        if (options.length === 0) {
          classDateSelect.innerHTML = `<option value="">Belum ada jadwal yang tersedia untuk dibuatkan summary</option>`;
          return;
        }

        classDateSelect.innerHTML = `
          <option value="">Pilih tanggal kelas</option>
          ${options.map(option => {
            return `
              <option
                value="${option.date}"
                data-start-time="${option.start_time}"
                data-end-time="${option.end_time}"
                data-class-type="${option.class_type}"
                data-routine-schedule-id="${option.routine_schedule_id || ''}"
                data-exception-id="${option.exception_id || ''}"
              >
                ${escapeHtml(option.label)}
              </option>
            `;
          }).join('')}
        `;
      } catch (error) {
        console.error('LOAD CLASS DATES ERROR:', error);
        alert('Terjadi kesalahan saat mengambil tanggal kelas.');
        resetClassDateOptions('Gagal memuat tanggal kelas');
      }
    }

    async function submitSummary(event) {
      event.preventDefault();

      const studentId = document.getElementById('nama-siswa').value;
      const levelId = document.getElementById('level').value;
      const classDate = document.getElementById('tanggal-kelas').value;
      const classType = document.getElementById('jenis-kelas').value;
      const summaryText = document.getElementById('detail-summary').value.trim();
      const keterangan = document.getElementById('keterangan').value.trim();

      if (!studentId || !levelId || !classDate || !classType || !summaryText) {
        alert('Siswa, level, tanggal kelas, jenis kelas, dan detail summary wajib diisi.');
        return;
      }

      try {
        const response = await fetch('/api/summaries', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${getToken()}`
          },
          body: JSON.stringify({
            student_id: Number(studentId),
            level_id: Number(levelId),
            class_date: classDate,
            class_type: classType,
            keterangan: keterangan,
            summary_text: summaryText
          })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.message || 'Gagal menyimpan summary.');
          return;
        }

        alert(result.message || 'Summary berhasil disimpan.');
        window.location.href = '/mentor/summary/summary.html';
      } catch (error) {
        console.error('CREATE SUMMARY ERROR:', error);
        alert('Terjadi kesalahan saat menyimpan summary.');
      }
    }

    function resetClassDateOptions(message = 'Pilih siswa dan level terlebih dahulu') {
      document.getElementById('tanggal-kelas').innerHTML = `
        <option value="">${escapeHtml(message)}</option>
      `;
    }

    function resetClassType() {
      document.getElementById('jenis-kelas').value = '';
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
