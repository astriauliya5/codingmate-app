<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Siswa Mentor</title>

  <link rel="stylesheet" href="data-siswa.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Data Siswa</h1>

        <div class="data-controls">
          <div class="entry-sort-row">
            <label>
              Tampilkan
              <select id="tampil">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
              data
            </label>

            <button
              type="button"
              id="sortToggleBtn"
              class="sort-toggle-btn"
              data-sort="newest"
              aria-label="Urutkan data"
            >
              ↕
              <span class="sort-tooltip" id="sortTooltip">
                Urutkan dari data terbaru ke terlama
              </span>
            </button>
          </div>

          <div class="search-box">
            <input type="text" id="search" placeholder="🔍 Search">
          </div>
        </div>

      <div class="table-wrapper">
        <table id="table-container">
          <thead>
            <tr>
              <th>No</th>
              <th>Full Name</th>
              <th>Nickname</th>
              <th>Parent Name</th>
              <th>Born Date</th>
              <th>Age</th>
              <th>Tanggal Bergabung</th>
              <th>Lama Bergabung</th>
              <th>Kelas Awal</th>
              <th>Kelas Sekarang</th>
              <th>No Telp</th>
              <th>Kota</th>
              <th>Sekolah</th>
              <th>Alamat</th>
              <th>Email</th>
            </tr>
          </thead>

          <tbody id="data-table-body">
            <tr>
              <td colspan="15">Memuat data siswa...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    let allDataSiswa = [];
    let currentData = [];

    document.addEventListener('DOMContentLoaded', async function () {
      await loadMentorStudents();

      const searchInput = document.getElementById('search');
      const tampilSelect = document.getElementById('tampil');
      const sortToggleBtn = document.getElementById('sortToggleBtn');
      const sortTooltip = document.getElementById('sortTooltip');

      searchInput.addEventListener('input', applyFilterSortAndRender);

      tampilSelect.addEventListener('change', function () {
        generateTableRows(currentData);
      });

      sortToggleBtn.addEventListener('click', function () {
        const currentSort = this.dataset.sort || 'newest';
        const nextSort = currentSort === 'newest' ? 'oldest' : 'newest';

        this.dataset.sort = nextSort;

        sortTooltip.textContent =
          nextSort === 'newest'
            ? 'Urutkan dari data terbaru ke terlama'
            : 'Urutkan dari data terlama ke terbaru';

        applyFilterSortAndRender();
      });
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    async function loadMentorStudents() {
      try {
        const response = await fetch('/api/students/mentor', {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET MENTOR STUDENTS ERROR:', result);
          alert(result.message || 'Gagal mengambil data siswa mentor.');
          return;
        }

        allDataSiswa = Array.isArray(result) ? result : [];
        applyFilterSortAndRender();
      } catch (error) {
        console.error('LOAD MENTOR STUDENTS ERROR:', error);
        alert('Terjadi kesalahan saat mengambil data siswa mentor.');
      }
    }

    function applyFilterSortAndRender() {
      const searchInput = document.getElementById('search');
      const sortToggleBtn = document.getElementById('sortToggleBtn');

      const query = searchInput.value.toLowerCase();
      const sortOrder = sortToggleBtn.dataset.sort || 'newest';

      currentData = allDataSiswa.filter(student => {
        const combinedText = [
          student.id,
          student.full_name,
          student.nickname,
          student.parent_name,
          student.born_date,
          student.age,
          student.joined_date,
          student.duration,
          student.initial_class,
          student.current_class,
          student.phone,
          student.city,
          student.school,
          student.address,
          student.email
        ].join(' ').toLowerCase();

        return combinedText.includes(query);
      });

      currentData.sort((a, b) => {
        const idA = Number(a.id || 0);
        const idB = Number(b.id || 0);

        if (sortOrder === 'oldest') {
          return idA - idB;
        }

        return idB - idA;
      });

      generateTableRows(currentData);
    }

    function generateTableRows(data) {
      const tableBody = document.querySelector('#data-table-body');
      const jumlahTampil = Number(document.getElementById('tampil').value);

      tableBody.innerHTML = '';

      const limitedData = data.slice(0, jumlahTampil);

      if (limitedData.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="15">Belum ada data siswa.</td>
          </tr>
        `;
        return;
      }

      limitedData.forEach((student, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>

          <td>
            <button class="btn-name" onclick="showDetailSiswa(${student.id})">
              ${escapeHtml(student.full_name || '-')}
            </button>
          </td>

          <td>${escapeHtml(student.nickname || '-')}</td>
          <td>${escapeHtml(student.parent_name || '-')}</td>
          <td>${formatDate(student.born_date)}</td>
          <td>${escapeHtml(student.age ?? '-')}</td>
          <td>${formatDate(student.joined_date)}</td>
          <td>${escapeHtml(student.duration || '-')}</td>
          <td>${escapeHtml(student.initial_class || '-')}</td>
          <td>${escapeHtml(student.current_class || '-')}</td>
          <td>${escapeHtml(student.phone || '-')}</td>
          <td>${escapeHtml(student.city || '-')}</td>
          <td>${escapeHtml(student.school || '-')}</td>
          <td>${escapeHtml(student.address || '-')}</td>
          <td>${escapeHtml(student.email || '-')}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    function showDetailSiswa(studentId) {
      window.location.href = `detail-data-siswa.html?id=${studentId}`;
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="/assets/js/sidebar-mentor.js"></script>
</body>
</html>
