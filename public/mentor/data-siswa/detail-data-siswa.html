<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detail Data Siswa</title>
  <link rel="stylesheet" href="data-siswa.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>

<body>
  <div class="container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <h1>Detail Data Siswa</h1>

      <button class="btn-back" onclick="window.history.back()">Back</button>

      <div class="detail-layout">
        <section class="student-card">
          <div class="photo-box" id="photoBox">
            <span>Foto</span>
          </div>

          <div id="siswa-detail-container">
            <div>Memuat detail siswa...</div>
          </div>
        </section>

        <aside class="right-panel">
          <div id="level-record-container">
            <h2>Level Record</h2>

            <div class="level-tabs" id="levelTabs">
              <button class="level-tab active">-</button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>No.</th>
                  <th>Tanggal Kelas</th>
                  <th>Keterangan</th>
                </tr>
              </thead>

              <tbody id="levelRecordBody">
                <tr>
                  <td colspan="3">Memuat level record...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="credit-container">
            <div class="credit-section">
              <h2>Sisa Kredit</h2>
              <div id="remainingCreditList">
                <div class="credit-row">
                  <span>-</span>
                  <strong>:</strong>
                  <b>-</b>
                </div>
              </div>
            </div>

            <div class="credit-section">
              <h2>Tanggal Expired</h2>
              <div id="expiredDateList">
                <div class="credit-row">
                  <span>-</span>
                  <strong>:</strong>
                  <b>-</b>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    let studentDetailData = null;
    let approvedRecords = [];
    let activeLevelId = null;

    document.addEventListener('DOMContentLoaded', async function () {
      await loadMentorStudentDetail();
    });

    function getToken() {
      return localStorage.getItem('token');
    }

    function getStudentIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function loadMentorStudentDetail() {
      const studentId = getStudentIdFromUrl();
      const container = document.getElementById('siswa-detail-container');

      if (!studentId) {
        container.innerHTML = `<div>Data siswa tidak ditemukan karena ID siswa tidak tersedia.</div>`;
        return;
      }

      try {
        const response = await fetch(`/api/students/mentor/${studentId}`, {
          headers: {
            Authorization: `Bearer ${getToken()}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('GET MENTOR STUDENT DETAIL ERROR:', result);
          container.innerHTML = `<div>${escapeHtml(result.message || 'Gagal mengambil detail siswa.')}</div>`;
          return;
        }

        studentDetailData = result;

        approvedRecords = (result.records || []).filter(record => {
          return record.status === 'terkirim';
        });

        renderStudentDetail(result.student);
        renderCreditSections(result.levels);
        renderLevelTabs(result.levels, approvedRecords);
      } catch (error) {
        console.error('LOAD MENTOR STUDENT DETAIL ERROR:', error);
        container.innerHTML = `<div>Terjadi kesalahan saat mengambil detail siswa.</div>`;
      }
    }

    function renderStudentDetail(siswa) {
      const container = document.getElementById('siswa-detail-container');
      const photoBox = document.getElementById('photoBox');

      if (siswa.photo) {
        photoBox.innerHTML = `
          <img 
            src="${escapeAttribute(siswa.photo)}" 
            alt="Foto siswa" 
            style="width: 100%; height: 100%; object-fit: cover;"
          >
        `;
      } else {
        photoBox.innerHTML = `<span>Foto</span>`;
      }

      container.innerHTML = `
        <div class="detail-row">
          <span>Full Name</span>
          <p>${escapeHtml(siswa.full_name || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Nickname</span>
          <p>${escapeHtml(siswa.nickname || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Parent Name</span>
          <p>${escapeHtml(siswa.parent_name || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Born Date</span>
          <p>${formatDate(siswa.born_date)}</p>
        </div>

        <div class="detail-row">
          <span>Age</span>
          <p>${escapeHtml(siswa.age ?? '-')}</p>
        </div>

        <div class="detail-row">
          <span>Tgl. Bergabung</span>
          <p>${formatDate(siswa.joined_date)}</p>
        </div>

        <div class="detail-row">
          <span>Lama Bergabung</span>
          <p>${escapeHtml(siswa.duration || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Kelas Awal</span>
          <p>${escapeHtml(siswa.initial_class || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Kelas Sekarang</span>
          <p>${escapeHtml(siswa.current_class || '-')}</p>
        </div>

        <div class="detail-row">
          <span>No. Telp</span>
          <p>${escapeHtml(siswa.phone || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Kota</span>
          <p>${escapeHtml(siswa.city || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Sekolah</span>
          <p>${escapeHtml(siswa.school || '-')}</p>
        </div>

        <div class="detail-row">
          <span>Email</span>
          <p>${escapeHtml(siswa.email || '-')}</p>
        </div>
      `;
    }

    function renderCreditSections(levels) {
      const remainingCreditList = document.getElementById('remainingCreditList');
      const expiredDateList = document.getElementById('expiredDateList');

      if (!levels || levels.length === 0) {
        remainingCreditList.innerHTML = `
          <div class="credit-row">
            <span>-</span>
            <strong>:</strong>
            <b>-</b>
          </div>
        `;

        expiredDateList.innerHTML = `
          <div class="credit-row">
            <span>-</span>
            <strong>:</strong>
            <b>-</b>
          </div>
        `;
        return;
      }

      remainingCreditList.innerHTML = levels.map(level => {
        return `
          <div class="credit-row">
            <span>${escapeHtml(level.level_name || '-')}</span>
            <strong>:</strong>
            <b>${escapeHtml(level.remaining_credit ?? '-')}</b>
          </div>
        `;
      }).join('');

      expiredDateList.innerHTML = levels.map(level => {
        return `
          <div class="credit-row">
            <span>${escapeHtml(level.level_name || '-')}</span>
            <strong>:</strong>
            <b>${formatDate(level.latest_expired_at)}</b>
          </div>
        `;
      }).join('');
    }

    function renderLevelTabs(levels, records) {
      const tabsContainer = document.getElementById('levelTabs');
      const recordBody = document.getElementById('levelRecordBody');

      if (!levels || levels.length === 0) {
        tabsContainer.innerHTML = `<button class="level-tab active">-</button>`;
        recordBody.innerHTML = `
          <tr>
            <td colspan="3">Belum ada level aktif.</td>
          </tr>
        `;
        return;
      }

      activeLevelId = Number(levels[0].level_id);

      tabsContainer.innerHTML = levels.map((level, index) => {
        return `
          <button
            type="button"
            class="level-tab ${index === 0 ? 'active' : ''}"
            data-level-id="${level.level_id}"
            onclick="setActiveLevel(${level.level_id})"
          >
            ${escapeHtml(level.level_name || '-')}
          </button>
        `;
      }).join('');

      renderLevelRecords(records || []);
    }

    function setActiveLevel(levelId) {
      activeLevelId = Number(levelId);

      document.querySelectorAll('.level-tab').forEach(button => {
        button.classList.toggle(
          'active',
          Number(button.dataset.levelId) === Number(levelId)
        );
      });

      renderLevelRecords(approvedRecords);
    }

    function renderLevelRecords(records) {
      const recordBody = document.getElementById('levelRecordBody');

      const filteredRecords = (records || []).filter(record => {
        return Number(record.level_id) === Number(activeLevelId)
          && record.status === 'terkirim';
      });

      if (filteredRecords.length === 0) {
        recordBody.innerHTML = `
          <tr>
            <td colspan="3">Belum ada record summary yang sudah disetujui untuk level ini.</td>
          </tr>
        `;
        return;
      }

      recordBody.innerHTML = filteredRecords.map((record, index) => {
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${formatDate(record.class_date)}</td>
            <td>${escapeHtml(record.keterangan || record.summary_text || '-')}</td>
          </tr>
        `;
      }).join('');
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return dateValue;
      }

      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>

  <script src="/assets/js/auth-guard.js"></script>
  <script src="/assets/js/sidebar-mentor.js"></script>
</body>
</html>
